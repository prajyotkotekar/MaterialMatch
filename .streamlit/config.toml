[client]
toolbarMode = "minimal"

# One dark identity ("intelligence center"): the whole UI is designed for charcoal, so there is no light variant.
[theme]
base = "dark"
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["40px", "24px", "19px", "15px", "14px", "12px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
linkUnderline = true
primaryColor = "#BEF04A"
backgroundColor = "#121512"
secondaryBackgroundColor = "#20251F"
textColor = "#E9ECE4"
linkColor = "#BEF04A"
borderColor = "#2E352D"
dataframeBorderColor = "#2B312A"
dataframeHeaderBackgroundColor = "#191D19"
codeBackgroundColor = "#191D19"
greenColor = "#BEF04A"
blueColor = "#8BA8D4"
orangeColor = "#F0A43A"
violetColor = "#C29AD4"
redColor = "#E8776E"
yellowColor = "#D6BC78"
grayColor = "#99A296"
chartCategoricalColors = ["#B48F6E", "#8BA8D4", "#E3965F", "#C29AD4", "#D6BC78", "#79C3BA", "#A9B1B6", "#A9BE6E", "#D88580"]
