[client]
toolbarMode = "minimal"
# Errors show their type only, never a traceback with file paths
showErrorDetails = "type"

[server]
# Same 10 MB per photo as the API (Streamlit's default is 200 MB)
maxUploadSize = 10

[browser]
# No usage statistics sent to Streamlit
gatherUsageStats = false

# One identity: true black with an off-white result card, so there is no separate light variant.
[theme]
base = "dark"
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap"
codeFont = "'IBM Plex Mono':https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["40px", "24px", "19px", "15px", "14px", "12px"]
headingFontWeights = [650, 600, 600, 600, 600, 600]
baseRadius = "3px"
buttonRadius = "3px"
showWidgetBorder = true
linkUnderline = true
primaryColor = "#C6F25A"
backgroundColor = "#000000"
secondaryBackgroundColor = "#151715"
textColor = "#F2F3EE"
linkColor = "#C6F25A"
borderColor = "#2C302C"
dataframeBorderColor = "#232723"
dataframeHeaderBackgroundColor = "#0C0D0C"
codeBackgroundColor = "#0C0D0C"
greenColor = "#C6F25A"
blueColor = "#8BA8D4"
orangeColor = "#F0A43A"
violetColor = "#C29AD4"
redColor = "#E8776E"
yellowColor = "#D6BC78"
grayColor = "#A4ABA2"
chartCategoricalColors = ["#B48F6E", "#8BA8D4", "#E3965F", "#C29AD4", "#D6BC78", "#79C3BA", "#A9B1B6", "#A9BE6E", "#D88580"]
